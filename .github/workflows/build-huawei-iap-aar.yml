# Builds the HuaweiIAP plugin AAR in the cloud - no PC / Android Studio needed.
#
# Assumes this file lives at <repo-root>/.github/workflows/ and the Godot
# project (containing android/huawei-iap-plugin/) is at <repo-root>.
# If your repo root is one level up (i.e. this workflow sits in
# new-game-project/.github/workflows/), move the whole .github folder up to                         # the repo root OR prefix every path below with "new-game-project/".
#
# Usage: push, then Actions tab > "Build HuaweiIAP AAR" > Run workflow
# (it also runs automatically when the plugin sources change).                                      # Download the "HuaweiIAP-aar" artifact, rename the file to HuaweiIAP.aar,
# and place it in <project>/android/plugins/ next to HuaweiIAP.gdap.

name: Build HuaweiIAP AAR

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/huawei-iap-plugin/**'
      - '.github/workflows/build-huawei-iap-aar.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/huawei-iap-plugin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Build release AAR
        run: gradle :huawei-iap:assembleRelease --stacktrace

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuaweiIAP-aar
          path: android/huawei-iap-plugin/huawei-iap/build/outputs/aar/huawei-iap-release.aar
          if-no-files-found: error
